apiVersion: v1
kind: ConfigMap
metadata:
  name: at-ai-tool-dashboard-configmap
  namespace: advtech
data:
  sso.properties: |
    env=prod
    appid=AIDashboardPROD
    scope=role email constituentid acsid firstname lastname groups divisions source products offer roles
    redirecturl=https://javias.acs.org/Dashboard/redirect
    protectedPaths=/Dashboard
    publicFiles=HealthMonitor,page_not_found,error,style.css,all.min.css,bootstrap.min.css
    protectedFiles=
    continueLabel=Back to AI Dashboard
    cancelurl=https://javias.acs.org/Dashboard/
    returnURL=https://javias.acs.org/Dashboard/