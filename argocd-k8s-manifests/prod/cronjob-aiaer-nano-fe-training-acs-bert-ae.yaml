apiVersion: batch/v1
kind: CronJob
metadata:
  name: at-ai-aer-nano-fe-training-acs-bert-ae
  namespace: advtech
spec:
  schedule: "0 7 * * 6"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: at-ai-aer-nano-fe-training-acs-bert-ae
            image: ghcr.io/acspubsedsg/at-ai-aer-nano-fe-training:prod
            imagePullPolicy: Always
            env:
            - name: LD_LIBRARY_PATH
              value: /usr/local/nvidia/lib64
            resources:
              requests:
                cpu: 4200m 
                memory: 19000Mi
                nvidia.com/gpu: 1
              limits:
                cpu: 4500m 
                memory: 20000Mi
                nvidia.com/gpu: 1
            command:
            - /bin/sh
            - -c
            - mv nano_prod_db.ini nano_db.ini && sh acs_bert_ae.sh
            volumeMounts:
            - name: filestore 
              mountPath: /NAS
            - mountPath: /usr/local/nvidia
              name: nvidia            
          tolerations:
          - key: nvidia.com/gpu
            operator: Exists
            effect: NoSchedule          
          imagePullSecrets:
          - name: ghcr-token-github-com
          volumes:
          - name: nvidia          
            hostPath:
              path: /home/kubernetes/bin/nvidia          
          - name: filestore
            persistentVolumeClaim:
              claimName: filestore-nfs-pvc
              readOnly: false
          restartPolicy: OnFailure