apiVersion: apps/v1
kind: Deployment
metadata:
  name: at-ai-specter-init-embed
spec:
  replicas: 1
  selector:
    matchLabels:
      app: at-ai-specter-init-embed
  template:
    metadata:
      labels:
        app: at-ai-specter-init-embed
    spec:
      containers:
        - name: at-ai-specter-init-embed
          image: ghcr.io/acspubsedsg/at-ai-specter-init-embed:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5005
          env:
            - name: TZ
              value: EST
          resources:
            requests:
              cpu: 1000m
              memory: 2048Mi
            limits:
              cpu: 1500m
              memory: 3072Mi
          command:  
          - /bin/sh
          - -c
          - python init-embed.py
          volumeMounts:
            - name: filestore
              mountPath: /NAS
      imagePullSecrets:
        - name: ghcr-token-github-com
      volumes:
        - name: filestore
          persistentVolumeClaim:
            claimName: filestore-nfs-pvc
            readOnly: false