apiVersion: batch/v1
kind: CronJob
metadata:
  name: at-ai-arr-fe-training-reviewer-top-n
  namespace: advtech
spec:
  timeZone: "EST"
  schedule: "0 10 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: at-ai-arr-fe-training-reviewer-top-n
            image: ghcr.io/acspubsedsg/at-ai-arr-fe-training@sha256:a2de344f57e708ec24f9099e4b43d3a66cfb58c709d4be057d41800254be6141
            imagePullPolicy: Always
            env:
            - name: LD_LIBRARY_PATH
              value: /usr/local/nvidia/lib64
            resources:
              requests:
                cpu: 13200m
                memory: 50000Mi
                nvidia.com/gpu: 1
              limits:
                cpu: 14500m
                memory: 50000Mi
                nvidia.com/gpu: 1
            command:
            - /bin/sh
            - -c
            - mkdir -p /NAS/AIMODELS/manuscript-reviewer/vector && mkdir -p /NAS/AIMODELS/manuscript-reviewer/data && mv document-top-n_prod.ini document-top-n.ini && sh reviewer_top_n.sh
            volumeMounts:
            - name: filestore 
              mountPath: /NAS
            - mountPath: /usr/local/nvidia
              name: nvidia
            - mountPath: /appl/iapps/config/
              name: secret-server-configmap
          tolerations:
          - key: nvidia.com/gpu
            operator: Exists
            effect: NoSchedule          
          imagePullSecrets:
          - name: ghcr-token-github-com
          volumes:
          - name: nvidia          
            hostPath:
              path: /home/kubernetes/bin/nvidia          
          - name: filestore
            persistentVolumeClaim:
              claimName: filestore-nfs-pvc
              readOnly: false
          - name: secret-server-configmap
            configMap:
              name: secret-server-configmap
          restartPolicy: OnFailure
