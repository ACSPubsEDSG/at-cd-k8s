apiVersion: batch/v1
kind: CronJob
metadata:
  name: at-ai-att-fe-training-trnsfrcnnjob
  namespace: advtech
spec:
  timeZone: "EST"
  schedule: "0/2 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: at-ai-att-fe-training-trnsfrcnnjob
            image: ghcr.io/acspubsedsg/ai-att-training-be:prod
            imagePullPolicy: Always
            env:
            - name: LD_LIBRARY_PATH
              value: /usr/local/nvidia/lib64
            resources:
              requests:
                cpu: 14000m
                memory: 19000Mi
                nvidia.com/gpu: 1
              limits:
                cpu: 15500m
                memory: 20000Mi
                nvidia.com/gpu: 1
            command:
            - /bin/sh
            - -c
            -  mkdir -p /NAS/AIMODELS/manuscript-transfer-cnn/model && mkdir -p /NAS/AIMODELS/manuscript-transfer-cnn/aiatt-model/data && mkdir -p /NAS/AIMODELS/manuscript-transfer-cnn/data && mv config/manuscript-transfer-cnn_prod.ini config/manuscript-transfer-cnn.ini && conda run --name manuscript-transfer-cnn python -u cnn_gensim.py
            volumeMounts:
            - mountPath: /usr/local/nvidia
              name: nvidia
            - name: filestore 
              mountPath: /NAS
          tolerations:
          - key: nvidia.com/gpu
            operator: Exists
            effect: NoSchedule
          imagePullSecrets:
          - name: ghcr-token-github-com
          volumes:
          - name: nvidia          
            hostPath:
              path: /home/kubernetes/bin/nvidia
          - name: filestore
            persistentVolumeClaim:
              claimName: filestore-nfs-pvc
              readOnly: false
          restartPolicy: OnFailure