kind: ServiceAccount
apiVersion: v1
metadata:
  name: restart-deployment
  namespace: advtech
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: restart-deployment
  namespace: advtech
rules:
  - apiGroups: ["apps", "extensions"]
    resources: ["deployments"]
    resourceNames: ["at-ai-att-fe-inferencing", "at-ai-aoe-fe-inferencing","at-ai-aer-nano-fe-inferencing-ae","at-ai-aer-nano-fe-inferencing-ee","at-ai-aer-jacs-fe-inferencing-realtime-topn","at-ai-aer-jacs-fe-inferencing-predict-manuscript","at-ai-aer-ami-fe-inferencing-ae","at-ai-aer-ami-fe-inferencing-ee"]
    verbs: ["get", "patch", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: restart-deployment
  namespace: advtech
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: restart-deployment
subjects:
  - kind: ServiceAccount
    name: restart-deployment
    namespace: advtech