apiVersion: batch/v1
kind: CronJob
metadata:
  name: at-ai-aer-ami-fe-training-model-update
  namespace: advtech
spec:
  timeZone: "EST"
  schedule: "40 17 * * 6"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: at-ai-aer-ami-fe-training-model-update
            image: ghcr.io/acspubsedsg/at-ai-aer-ami-fe-training:prod
            imagePullPolicy: Always
            env:
            - name: LD_LIBRARY_PATH
              value: /usr/local/nvidia/lib64
            resources:
              requests:
                cpu: 3200m 
                memory: 7500Mi
                nvidia.com/gpu: 1
              limits:
                cpu: 3500m 
                memory: 8000Mi
                nvidia.com/gpu: 1
            command:
            - /bin/sh
            - -c
            - mv aiaer_ami_prod.ini aiaer_ami.ini && conda run --name aiaer_scibert_tf2 python ami_model_update.py
            volumeMounts:
            - name: filestore 
              mountPath: /NAS
            - mountPath: /usr/local/nvidia
              name: nvidia            
          tolerations:
          - key: nvidia.com/gpu
            operator: Exists
            effect: NoSchedule          
          imagePullSecrets:
          - name: ghcr-token-github-com
          volumes:
          - name: nvidia          
            hostPath:
              path: /home/kubernetes/bin/nvidia          
          - name: filestore
            persistentVolumeClaim:
              claimName: filestore-nfs-pvc
              readOnly: false
          restartPolicy: OnFailure