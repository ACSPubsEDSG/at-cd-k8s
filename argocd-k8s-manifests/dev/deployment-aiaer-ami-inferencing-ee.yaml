apiVersion: apps/v1
kind: Deployment
metadata:
  name: at-ai-aer-ami-fe-inferencing-ee
  namespace: advtech
spec:
  replicas: 1
  selector:
    matchLabels:
      app: at-ai-aer-ami-fe-inferencing-ee
  template:
    metadata:
      labels:
        app: at-ai-aer-ami-fe-inferencing-ee
    spec:
      containers:
        - name: at-ai-aer-ami-fe-inferencing-ee
          image: ghcr.io/acspubsedsg/at-ai-aer-ami-fe-inferencing:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5009
          resources:
            requests:
              cpu: 1000m
              memory: 2048Mi
            limits:
              cpu: 1500m
              memory: 3072Mi
          command:  
          - /bin/sh
          - -c
          - mv aiaer_ami_dev.ini aiaer_ami.ini && conda run --name aiaer_scibert python ami_predict_ee_api.py
          volumeMounts:
            - name: filestore
              mountPath: /NAS
      imagePullSecrets:
        - name: ghcr-token-github-com
      volumes:
        - name: filestore
          persistentVolumeClaim:
            claimName: filestore-nfs-pvc
            readOnly: false