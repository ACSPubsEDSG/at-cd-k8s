apiVersion: batch/v1
kind: CronJob
metadata:
  name: at-ai-aer-ami-fe-training-acs-bert-ae
  namespace: advtech
spec:
  schedule: "0 6 * * 0"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: at-ai-aer-ami-fe-training-acs-bert-ae
            image: ghcr.io/acspubsedsg/at-ai-aer-ami-fe-training:latest
            imagePullPolicy: Always
            resources:
              requests:
                cpu: 8000m 
                memory: 8000Mi
                nvidia.com/gpu: 1
              limits:
                cpu: 8000m 
                memory: 8000Mi
                nvidia.com/gpu: 1
            command:
            - /bin/sh
            - -c
            - mv aiaer_scibert_dev.ini aiaer_scibert.ini && sh acs_bert_ae.sh
            volumeMounts:
            - name: filestore 
              mountPath: /NAS
            - mountPath: /usr/local/nvidia
              name: nvidia            
          tolerations:
          - key: nvidia.com/gpu
            operator: Exists
            effect: NoSchedule          
          imagePullSecrets:
          - name: ghcr-token-github-com
          volumes:
          - name: nvidia          
            hostPath:
              path: /home/kubernetes/bin/nvidia          
          - name: filestore
            persistentVolumeClaim:
              claimName: filestore-nfs-pvc
              readOnly: false
          restartPolicy: OnFailure