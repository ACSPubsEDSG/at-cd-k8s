apiVersion: v1
kind: ConfigMap
metadata:
  name: at-ai-tool-dashboard-configmap
  namespace: advtech
data:
  sso.properties: |
    env=dev
    appid=AIDashboardGCPDev
    scope=role email constituentid acsid firstname lastname groups divisions source products offer roles
    redirectURL=https://javiasdev.gcp.acs.org/Dashboard/redirect
    protectedPaths=/Dashboard/
    publicFiles=HealthMonitor,page_not_found,error,style.css,all.min.css,bootstrap.min.css
    protectedFiles=
    continueLabel=Back to AIDA Dashboard
    cancelURL=https://javiasdev.gcp.acs.org/Dashboard/
    returnURL=https://javiasdev.gcp.acs.org/Dashboard/