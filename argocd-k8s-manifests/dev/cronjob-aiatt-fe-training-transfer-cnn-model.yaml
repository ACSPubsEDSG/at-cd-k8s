apiVersion: batch/v1
kind: CronJob
metadata:
  name: at-ai-att-fe-training-trnsfrcnnjob
  namespace: advtech
spec:
  schedule: "50 10 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: at-ai-att-fe-training-trnsfrcnnjob
            image: ghcr.io/acspubsedsg/ai-att-training-be:latest
            imagePullPolicy: Always
            resources:
              requests:
                cpu: 1000m 
                memory: 2048Mi
              limits:
                cpu: 1500m 
                memory: 3072Mi
            command:
            - /bin/sh
            - -c
            - mv config/manuscript-transfer-cnn_dev.ini config/manuscript-transfer-cnn.ini && conda run --name manuscript-transfer-cnn python cnn_gensim.py
            volumeMounts:
            - name: filestore 
              mountPath: /app/NAS
          imagePullSecrets:
          - name: ghcr-token-github-com
          volumes:
          - name: filestore
            persistentVolumeClaim:
              claimName: filestore-nfs-pvc
              readOnly: false
          restartPolicy: OnFailure