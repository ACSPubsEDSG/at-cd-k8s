apiVersion: batch/v1
kind: CronJob
metadata:
  name: at-ai-att-fe-training-gnsmjob
  namespace: advtech
spec:
  schedule: "30 04 * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: at-ai-att-fe-training-gnsmjob
            image: ghcr.io/acspubsedsg/ai-att-training-be:latest
            imagePullPolicy: IfNotPresent
            resources:
              requests:
                cpu: 1000m 
                memory: 2048Mi
              limits:
                cpu: 1500m 
                memory: 3072Mi
            command:
            - /bin/sh
            - -c
            - conda run --name manuscript-transfer-cnn python manuscript_transfer_model_db.py
            volumeMounts:
            - name: filestore 
              mountPath: /NAS
          volume:
          - name: filestore
            persistentVolumeClaim:
              claimName: filestore-nfs-pvc
              readOnly: false
          restartPolicy: OnFailure