apiVersion: apps/v1
kind: Deployment
metadata:
  name: at-ai-att-fe-ui
  namespace: advtech
spec:
  replicas: 2
  selector:
    matchLabels:
      app: at-ai-att-fe-ui
  template:
    metadata:
      labels:
        app: at-ai-att-fe-ui
    spec:
      containers:
      - name: at-ai-att-fe-ui
        image: ghcr.io/acspubsedsg/at-ai-att-fe-ui:sha-09918f3
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: dev
        resources:
          requests:
            cpu: 1000m 
            memory: 2048Mi
          limits:
            cpu: 1500m 
            memory: 3072Mi
        volumeMounts:
        - mountPath: /appl/iapps/ssoProperties/
          name: at-ai-att-fe-ui-config-volume
      volumes:
        - name: at-ai-att-fe-ui-config-volume
          configMap:
            name: at-ai-att-fe-ui-configmap
      imagePullSecrets:
        - name: ghcr-token-github-com
      restartPolicy: Always
      hostAliases:
        - hostnames:
          - "dev-lnx-149.acs.org"
          ip: "172.23.40.254"