apiVersion: apps/v1
kind: Deployment
metadata:
  name: at-ai-att-fe-inferencing
  namespace: advtech
spec:
  replicas: 2
  selector:
    matchLabels:
      app: at-ai-att-fe-inferencing
  template:
    metadata:
      labels:
        app: at-ai-att-fe-inferencing
    spec:
      containers:
        - name: at-ai-att-fe-inferencing
          image: 'ghcr.io/acspubsedsg/at-ai-att-fe-inferencing:latest'
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5002
          resources:
            requests:
              cpu: 1000m
              memory: 2048Mi
            limits:
              cpu: 1500m
              memory: 3072Mi
          volumeMounts:
            - name: filestore
              mountPath: /NAS
      imagePullSecrets:
        - name: ghcr-token-github-com
      volumes:
        - name: filestore
          persistentVolumeClaim:
            claimName: filestore-nfs-pvc
            readOnly: false
