apiVersion: apps/v1
kind: Deployment
metadata:
  name: at-ai-aer-nano-fe-inferencing
  namespace: advtech
spec:
  replicas: 1
  selector:
    matchLabels:
      app: at-ai-aer-nano-fe-inferencing
  template:
    metadata:
      labels:
        app: at-ai-aer-nano-fe-inferencing
    spec:
      containers:
        - name: at-ai-aer-nano-fe-inferencing
          image: ghcr.io/acspubsedsg/at-ai-aer-nano-fe-inferencing:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5002
          resources:
            requests:
              cpu: 1000m
              memory: 2048Mi
            limits:
              cpu: 1500m
              memory: 3072Mi
          command:
          - /bin/sh
          - -c
          - mv nano_dev_db.ini nano_db.ini && sh nano_predict_api.sh
          volumeMounts:
            - name: filestore
              mountPath: /NAS
      imagePullSecrets:
        - name: ghcr-token-github-com
      volumes:
        - name: filestore
          persistentVolumeClaim:
            claimName: filestore-nfs-pvc
            readOnly: false
