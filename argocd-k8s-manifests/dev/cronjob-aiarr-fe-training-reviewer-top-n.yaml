apiVersion: batch/v1
kind: CronJob
metadata:
  name: at-ai-arr-fe-training-reviewer-top-n
  namespace: advtech
spec:
  schedule: "0 10 * * *"
  concurrencyPolicy: Replace
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: at-ai-arr-fe-training-reviewer-top-n
            image: ghcr.io/acspubsedsg/at-ai-arr-fe-training:latest
            imagePullPolicy: IfNotPresent
            resources:
              requests:
                cpu: 16000m 
                memory: 12288Mi
                nvidia.com/gpu: 1
              limits:
                cpu: 16000m 
                memory: 16384Mi
                nvidia.com/gpu: 1
            command:
            - /bin/sh
            - -c
            - mkdir -p /NAS/AIMODELS/manuscript-reviewer/vector && mkdir -p /NAS/AIMODELS/manuscript-reviewer/data && mv document-top-n_dev.ini document-top-n.ini && sh reviewer_top_n.sh
            volumeMounts:
            - name: filestore 
              mountPath: /NAS
          tolerations:
          - key: nvidia.com/gpu
            operator: Exists
            effect: NoSchedule          
          imagePullSecrets:
          - name: ghcr-token-github-com
          volumes:
          - name: filestore
            persistentVolumeClaim:
              claimName: filestore-nfs-pvc
              readOnly: false
          restartPolicy: OnFailure