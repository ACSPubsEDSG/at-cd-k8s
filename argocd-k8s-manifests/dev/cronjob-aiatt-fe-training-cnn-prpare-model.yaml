apiVersion: batch/v1
kind: CronJob
metadata:
  name: at-ai-att-fe-training-cnnprparjob
  namespace: advtech
spec:
  schedule: "0 04 * * *"
  concurrencyPolicy: Replace
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: at-ai-att-fe-training-cnnprparjob
            image: ghcr.io/acspubsedsg/ai-att-training-be:latest
            imagePullPolicy: Always
            env:
            - name: LD_LIBRARY_PATH
              value: /usr/local/nvidia/lib64 
            resources:
              requests:
                cpu: 12000m
                memory: 12000Mi
              limits:
                cpu: 12500m
                memory: 12000Mi
            command:
            - /bin/sh
            - -c
            - mkdir -p /NAS/AIMODELS/manuscript-transfer-cnn/model && mv config/manuscript-transfer-cnn_dev.ini config/manuscript-transfer-cnn.ini && conda run --name manuscript-transfer-cnn python -u prepare.py
            volumeMounts:
            - name: filestore 
              mountPath: /NAS
          tolerations:
          - key: training
            operator: Equal
            value: cpu
            effect: NoSchedule
          restartPolicy: OnFailure
          imagePullSecrets:
          - name: ghcr-token-github-com
          volumes:
          - name: filestore
            persistentVolumeClaim:
              claimName: filestore-nfs-pvc
              readOnly: false