apiVersion: v1
kind: ConfigMap
metadata:
  name: at-ai-arr-fe-ui-configmap
  namespace: advtech
data:
  sso.properties: |
    env=dev
    appid=AIARR
    scope=role email constituentid acsid firstname lastname groups divisions source products offer roles
    protectedPaths=/review
    cancelurl=https://javiasdev.gcp.acs.org/review/home
    continueLabel=Back to AIARR
    default_max_age=30
    redirecturl=https://javiasdev.gcp.acs.org/review/home/redirect