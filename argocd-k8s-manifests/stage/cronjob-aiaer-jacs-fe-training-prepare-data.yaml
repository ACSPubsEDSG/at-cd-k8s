apiVersion: batch/v1
kind: CronJob
metadata:
  name: at-ai-aer-jacs-fe-training-prepare-data
  namespace: advtech
spec:
  schedule: "0 4 * * 6"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: at-ai-aer-jacs-fe-training-prepare-data
            image: ghcr.io/acspubsedsg/at-ai-aer-jacs-fe-training:latest
            imagePullPolicy: Always
            env:
            - name: LD_LIBRARY_PATH
              value: /usr/local/nvidia/lib64
            resources:
              requests:
                cpu: 3200m 
                memory: 8000Mi
                nvidia.com/gpu: 1
              limits:
                cpu: 3500m 
                memory: 8000Mi
                nvidia.com/gpu: 1
            command:
            - /bin/sh
            - -c
            - mkdir -p /NAS/AIMODELS/aiaer-dev/tmp_data/
              && mkdir -p /NAS/AIMODELS/aiaer-dev/data/ 
              && mkdir -p /NAS/AIMODELS/aiaer-dev/tmp_bert_output_model
              && mkdir -p /NAS/AIMODELS/aiaer-dev/bert_output_model
              && mkdir -p /NAS/AIMODELS/aiaer-dev/predict_output
              && mv aiaer_scibert_stag.ini aiaer_scibert.ini && sh aiaer_bert_prepare_data.sh
            volumeMounts:
            - name: filestore 
              mountPath: /NAS
            - mountPath: /usr/local/nvidia
              name: nvidia            
          tolerations:
          - key: nvidia.com/gpu
            operator: Exists
            effect: NoSchedule          
          imagePullSecrets:
          - name: ghcr-token-github-com
          volumes:
          - name: nvidia          
            hostPath:
              path: /home/kubernetes/bin/nvidia          
          - name: filestore
            persistentVolumeClaim:
              claimName: filestore-nfs-pvc
              readOnly: false
          restartPolicy: OnFailure