apiVersion: apps/v1
kind: Deployment
metadata:
  name: at-ai-aer-nano-fe-inferencing-ee
  namespace: advtech
spec:
  replicas: 1
  selector:
    matchLabels:
      app: at-ai-aer-nano-fe-inferencing-ee
  template:
    metadata:
      labels:
        app: at-ai-aer-nano-fe-inferencing-ee
    spec:
      containers:
        - name: at-ai-aer-nano-fe-inferencing-ee
          image: ghcr.io/acspubsedsg/at-ai-aer-nano-fe-inferencing:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5011
          resources:
            requests:
              cpu: 1000m
              memory: 2048Mi
            limits:
              cpu: 1500m
              memory: 3072Mi
          command:  
          - /bin/sh
          - -c
          - mv nano_stag_db.ini nano_db.ini && conda run --name aiaer_scibert python nano_predict_ee_api.py
          volumeMounts:
            - name: filestore
              mountPath: /NAS
      imagePullSecrets:
        - name: ghcr-token-github-com
      volumes:
        - name: filestore
          persistentVolumeClaim:
            claimName: filestore-nfs-pvc
            readOnly: false
