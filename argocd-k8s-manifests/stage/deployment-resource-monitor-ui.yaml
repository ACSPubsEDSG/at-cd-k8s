apiVersion: apps/v1
kind: Deployment
metadata:
  name: at-resource-monitor-ui
  namespace: advtech
spec:
  replicas: 1
  selector:
    matchLabels:
      app: at-resource-monitor-ui
  template:
    metadata:
      labels:
        app: at-resource-monitor-ui
    spec:
      containers:
        - name: at-resource-monitor-ui
          image: ghcr.io/acspubsedsg/at-resource-monitor-ui:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: test
          resources:
            requests:
              cpu: 1000m
              memory: 2048Mi
            limits:
              cpu: 1500m
              memory: 3072Mi
          volumeMounts:
            - mountPath: /appl/iapps/ssoProperties/
              name: at-resource-monitor-ui-config-volume
      volumes:
        - name: at-resource-monitor-ui-config-volume
          configMap:
            name: at-resource-monitor-ui-configmap
      imagePullSecrets:
        - name: ghcr-token-github-com
