apiVersion: v1
kind: Service
metadata:
  name: at-ai-tool-dashboard
  namespace: advtech
  annotations:
    cloud.google.com/backend-config: '{"ports": {"8080":"at-ai-att-fe-backendconfig"}}'
    cloud.google.com/neg: '{"ingress": true}'
  labels:
    app: at-ai-tool-dashboard
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app: at-ai-tool-dashboard