apiVersion: v1
kind: ConfigMap
metadata:
  name: at-ai-admin-tool-dashboard-configmap
  namespace: advtech
data:
  sso.properties: |
    env=test
    appid=AIDashboardADMINSTAG
    scope=role email constituentid acsid firstname lastname groups divisions source products offer roles
    redirecturl=https://javiastest-admin.acs.org/Dashboard/redirect
    protectedPaths=/Dashboard/
    publicFiles=HealthMonitor,page_not_found,error,style.css,all.min.css,bootstrap.min.css
    protectedFiles=
    continueLabel=Back to AIDA Dashboard
    cancelurl=https://javiastest-admin.acs.org/Dashboard/
    returnURL=https://javiastest-admin.acs.org/Dashboard/