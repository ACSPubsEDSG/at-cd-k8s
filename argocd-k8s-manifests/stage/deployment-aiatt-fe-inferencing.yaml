apiVersion: apps/v1
kind: Deployment
metadata:
  name: at-ai-att-fe-inferencing
  namespace: advtech
spec:
  replicas: 1
  selector:
    matchLabels:
      app: at-ai-att-fe-inferencing
  template:
    metadata:
      labels:
        app: at-ai-att-fe-inferencing
    spec:
      containers:
      - name: at-ai-att-fe-inferencing
        image: ghcr.io/acspubsedsg/at-ai-att-fe-inferencing:latest
        imagePullPolicy: Always
        ports:
          - containerPort: 5002
        resources:
          requests:
            cpu: 1000m
            memory: 2048Mi
          limits:
            cpu: 1500m
            memory: 3072Mi
        livenessProbe:
          initialDelaySeconds: 30
          periodSeconds: 5
          httpGet:
            path: /HealthMonitor
            port: 5002
        readinessProbe:
          initialDelaySeconds: 30
          periodSeconds: 5
          httpGet:
            path: /HealthMonitor
            port: 5002
        command:
        - /bin/sh
        - -c
        - mv config/manuscript-transfer-cnn_staging.ini config/manuscript-transfer-cnn.ini && conda run --name manuscript-transfer-cnn python predict.py
        volumeMounts:
        - name: filestore
          mountPath: /NAS
      imagePullSecrets:
      - name: ghcr-token-github-com
      volumes:
      - name: filestore
        persistentVolumeClaim:
          claimName: filestore-nfs-pvc
          readOnly: false
