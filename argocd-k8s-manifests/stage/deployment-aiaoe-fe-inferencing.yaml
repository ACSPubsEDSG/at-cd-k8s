apiVersion: apps/v1
kind: Deployment
metadata:
 name: at-ai-aoe-fe-inferencing-sim-evaluator-realtime
spec:
 replicas: 1
 selector:
   matchLabels:
     app: at-ai-aoe-fe-inferencing
 template:
   metadata:
     labels:
       app: at-ai-aoe-fe-inferencing
   spec:
     containers:
       - name: at-ai-aoe-fe-inferencing
         image: ghcr.io/acspubsedsg/at-ai-aoe-fe-inferencing:latest
         imagePullPolicy: Always
         ports:
           - containerPort: 5004
         resources:
           requests:
             cpu: 1000m
             memory: 2048Mi
           limits:
             cpu: 1500m
             memory: 3072Mi
         command:
         - /bin/sh
         - -c
         - mv aiamne-specter_stag.ini aiamne-specter.ini && python SimEvaluatorRealtime.py
         volumeMounts:
           - name: filestore
             mountPath: /NAS
     imagePullSecrets:
       - name: ghcr-token-github-com
     volumes:
       - name: filestore
         persistentVolumeClaim:
           claimName: filestore-nfs-pvc
           readOnly: false