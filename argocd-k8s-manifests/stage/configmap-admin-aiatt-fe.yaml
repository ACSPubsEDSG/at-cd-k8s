apiVersion: v1
kind: ConfigMap
metadata:
  name: at-ai-admin-att-fe-configmap
  namespace: advtech
data:
  sso.properties: |
    env=test
    appid=AIATTADMINSTAG
    scope=role email constituentid acsid firstname lastname groups divisions source products offer roles
    protectedPaths=/transfer
    cancelurl=https://javiastest-admin.acs.org/transfer/home
    continueLabel=Back to AIATT admin
    default_max_age=30
    redirecturl=https://javiastest-admin.acs.org/transfer/home/redirect
    returnURL=https://javiastest-admin.acs.org/transfer/home