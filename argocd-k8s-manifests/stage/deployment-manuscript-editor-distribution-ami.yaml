apiVersion: apps/v1
kind: Deployment
metadata:
  name: at-manuscript-editor-distribution-ami
  namespace: advtech
spec:
  replicas: 1
  selector:
    matchLabels:
      app: at-manuscript-editor-distribution-ami
  template:
    metadata:
      labels:
        app: at-manuscript-editor-distribution-ami
    spec:
      containers:
      - name: at-manuscript-editor-distribution-ami
        image: ghcr.io/acspubsedsg/at-manuscript-editor-distribution-ami:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: test
        resources:
          requests:
            cpu: 1000m 
            memory: 2048Mi
          limits:
            cpu: 1500m 
            memory: 3072Mi
        volumeMounts:
        - mountPath: /appl/iapps/config/
          name: secret-server-configmap
      volumes:
        - name: secret-server-configmap
          configMap:
            name: secret-server-configmap
      imagePullSecrets:
        - name: ghcr-token-github-com  
