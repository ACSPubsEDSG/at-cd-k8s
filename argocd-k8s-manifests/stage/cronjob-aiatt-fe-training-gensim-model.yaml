apiVersion: batch/v1
kind: CronJob
metadata:
  name: at-ai-att-fe-training-gnsmjob
  namespace: advtech
spec:
  schedule: "30 04 * * *"
  concurrencyPolicy: Replace
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: at-ai-att-fe-training-gnsmjob
            image: ghcr.io/acspubsedsg/ai-att-training-be:latest
            imagePullPolicy: Always
            resources:
              requests:
                cpu: 12000m
                memory: 14000Mi
                nvidia.com/gpu: 1
              limits:
                cpu: 15500m
                memory: 15000Mi
                nvidia.com/gpu: 1
            command:
            - /bin/sh
            - -c
            - mkdir -p /NAS/AIMODELS/manuscript-transfer-cnn/model && mkdir -p /NAS/AIMODELS/manuscript-transfer-cnn/aiatt-model/data && mv config/manuscript-transfer-cnn_staging.ini config/manuscript-transfer-cnn.ini && conda run --name manuscript-transfer-cnn python -u manuscript_transfer_model_db.py
            volumeMounts:
            - mountPath: /usr/local/nvidia
              name: nvidia
            - name: filestore 
              mountPath: /NAS
          tolerations:
          - key: nvidia.com/gpu
            operator: Exists
            effect: NoSchedule
          imagePullSecrets:
          - name: ghcr-token-github-com
          volumes:
          - name: nvidia
            hostPath:
              path: /home/kubernetes/bin/nvidia
          - name: filestore
            persistentVolumeClaim:
              claimName: filestore-nfs-pvc
              readOnly: false
          restartPolicy: OnFailure