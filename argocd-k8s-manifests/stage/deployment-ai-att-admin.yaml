apiVersion: apps/v1
kind: Deployment
metadata:
  name: at-ai-att-admin
  namespace: advtech
spec:
  replicas: 1
  selector:
    matchLabels:
      app: at-ai-att-admin
  template:
    metadata:
      labels:
        app: at-ai-att-admin
    spec:
      containers:
        - name: at-ai-att-admin
          image: ghcr.io/acspubsedsg/at-ai-att-admin:stage
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: test
          resources:
            requests:
              cpu: 1000m
              memory: 2048Mi
            limits:
              cpu: 1500m
              memory: 3072Mi
          volumeMounts:
            - mountPath: /appl/iapps/ssoProperties/
              name: at-ai-admin-att-fe-config-volume
      hostAliases:
        - hostnames:
            - "ssotest.acs.org"
          ip: "45.60.77.135"
      volumes:
        - name: at-ai-admin-att-fe-config-volume
          configMap:
            name: at-ai-admin-att-fe-configmap
      imagePullSecrets:
        - name: ghcr-token-github-com
