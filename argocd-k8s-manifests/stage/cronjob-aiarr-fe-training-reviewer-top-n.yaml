apiVersion: batch/v1
kind: CronJob
metadata:
  name: at-ai-arr-fe-training-reviewer-top-n
  namespace: advtech
spec:
  schedule: "*/60 05-17 * * *"
  concurrencyPolicy: Replace
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: at-ai-arr-fe-training-reviewer-top-n
            image: ghcr.io/acspubsedsg/at-ai-arr-fe-training:latest
            imagePullPolicy: Always
            env:
            - name: LD_LIBRARY_PATH
              value: /usr/local/nvidia/lib64
            resources:
              requests:
                cpu: 3200m 
                memory: 10000Mi
                nvidia.com/gpu: 1
              limits:
                cpu: 3500m 
                memory: 11800Mi
                nvidia.com/gpu: 1
            command:
            - /bin/sh
            - -c
            - mkdir -p /NAS/AIMODELS/manuscript-reviewer-stag/vector && mkdir -p /NAS/AIMODELS/manuscript-reviewer-stag/data && mv document-top-n_staging.ini document-top-n.ini && sh reviewer_top_n.sh
            volumeMounts:
            - name: filestore 
              mountPath: /NAS
            - mountPath: /usr/local/nvidia
              name: nvidia            
          tolerations:
          - key: nvidia.com/gpu
            operator: Exists
            effect: NoSchedule          
          imagePullSecrets:
          - name: ghcr-token-github-com
          volumes:
          - name: nvidia          
            hostPath:
              path: /home/kubernetes/bin/nvidia          
          - name: filestore
            persistentVolumeClaim:
              claimName: filestore-nfs-pvc
              readOnly: false
          restartPolicy: OnFailure