apiVersion: apps/v1
kind: Deployment
metadata:
  name: at-ai-arr-admin
  namespace: advtech
spec:
  replicas: 1
  selector:
    matchLabels:
      app: at-ai-arr-admin
  template:
    metadata:
      labels:
        app: at-ai-arr-admin
    spec:
      containers:
      - name: at-ai-arr-admin
        image: ghcr.io/acspubsedsg/at-ai-arr-admin:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: test
        resources:
          requests:
            cpu: 1000m 
            memory: 2048Mi
          limits:
            cpu: 1500m 
            memory: 3072Mi
      volumeMounts:
        - mountPath: /appl/iapps/ssoProperties/
          name: at-ai-admin-arr-fe-config-volume
      hostAliases:
        - hostnames:
            - "ssotest.acs.org"
          ip: "45.60.77.135"
      volumes:
        - name: at-ai-admin-arr-fe-config-volume
          configMap:
            name: at-ai-admin-arr-fe-configmap
      imagePullSecrets:
        - name: ghcr-token-github-com