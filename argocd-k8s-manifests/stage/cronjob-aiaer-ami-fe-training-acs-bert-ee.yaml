apiVersion: batch/v1
kind: CronJob
metadata:
  name: at-ai-aer-ami-fe-training-acs-bert-ee
  namespace: advtech
spec:
  schedule: "0 6 * * 0"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: at-ai-aer-ami-fe-training-acs-bert-ee
            image: ghcr.io/acspubsedsg/at-ai-aer-ami-fe-training:latest
            imagePullPolicy: Always
            resources:
              requests:
                cpu: 4200m 
                memory: 19500Mi
                nvidia.com/gpu: 1
              limits:
                cpu: 4500m 
                memory: 20000Mi
                nvidia.com/gpu: 1
            command:
            - /bin/sh
            - -c
            - mv aiaer_ami_stag.ini aiaer_ami.ini && sh acs_bert_ee_stag.sh
            volumeMounts:
            - name: filestore 
              mountPath: /NAS
            - mountPath: /usr/local/nvidia
              name: nvidia            
          tolerations:
          - key: nvidia.com/gpu
            operator: Exists
            effect: NoSchedule          
          imagePullSecrets:
          - name: ghcr-token-github-com
          volumes:
          - name: nvidia          
            hostPath:
              path: /home/kubernetes/bin/nvidia          
          - name: filestore
            persistentVolumeClaim:
              claimName: filestore-nfs-pvc
              readOnly: false
          restartPolicy: OnFailure