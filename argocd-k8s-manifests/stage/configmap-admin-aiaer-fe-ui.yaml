apiVersion: v1
kind: ConfigMap
metadata:
  name: at-ai-admin-aer-fe-ui-configmap
  namespace: advtech
data:
  sso.properties: |
    env=test
    appid=AIAERADMIN_STAG
    scope=role email constituentid acsid firstname lastname groups divisions source products offer roles
    protectedPaths=/editors
    cancelurl=https://javiastest-admin.acs.org/editors/home
    continueLabel=Back to AIAER admin
    default_max_age=30
    redirecturl=https://javiastest-admin.acs.org/editors/home/redirect
    returnURL=https://javiastest-admin.acs.org/editors/home