apiVersion: apps/v1
kind: Deployment
metadata:
  name: at-ai-arr-fe-inferencing
  namespace: advtech
spec:
  replicas: 1
  selector:
    matchLabels:
      app: at-ai-arr-fe-inferencing
  template:
    metadata:
      labels:
        app: at-ai-arr-fe-inferencing
    spec:
      containers:
        - name: at-ai-arr-fe-inferencing
          image: ghcr.io/acspubsedsg/at-ai-arr-fe-inferencing:latest
          imagePullPolicy: Always
          env:
          - name: LD_LIBRARY_PATH
            value: /usr/local/nvidia/lib64
          ports:
            - containerPort: 5003
          resources:
            requests:
              cpu: 1000m
              memory: 31400Mi
              nvidia.com/gpu: 1
            limits:
              cpu: 1500m
              memory: 32000Mi
              nvidia.com/gpu: 1
          command:
          - /bin/sh
          - -c
          - mv document-top-n_staging.ini document-top-n.ini && conda run --name aiarr_specter python manuscript_reviewer_realtime.py
          volumeMounts:
            - name: filestore
              mountPath: /NAS
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      imagePullSecrets:
        - name: ghcr-token-github-com
      volumes:
        - name: filestore
          persistentVolumeClaim:
            claimName: filestore-nfs-pvc
            readOnly: false
